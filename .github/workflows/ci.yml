name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # Testit palvelevat myös web-UI:ta staattisena (ks. test/api.test.ts) — pitää olla
      # rakennettuna ennen testejä, ei vasta lopullisen "Build"-vaiheen yhteydessä.
      - name: Build web UI
        run: npm run build:web

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
