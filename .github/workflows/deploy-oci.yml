# Deploys the shared Caddy frontdoor to an OCI compute instance over SSH (docker compose pull
# && up). No image to build here — Caddy runs the stock `caddy:2-alpine` image; this workflow
# just ships docker-compose.yml + Caddyfile and starts it. Inert until the required secrets
# exist — see below.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   OCI_HOST           — the compute instance's public IP or hostname
#   OCI_SSH_USER        — SSH username (e.g. "ubuntu" or "opc")
#   OCI_SSH_KEY         — SSH private key (PEM) matching a public key authorized on the instance
#
# Optional secrets (each is a sibling app's hostname sharing this Caddy — set the ones that
# exist so far, add more as new sibling apps come online):
#   OCI_DEPLOY_PATH     — remote directory to deploy into (default: /opt/taloni)
#   SUP_DOMAIN          — StraightUpProgress (see ../StraightUpProgress/DEPLOYMENT.md)
#   SUB_DOMAIN          — StraightUpBeats (see ../StraightUpBeats/DEPLOYMENT.md)
#   KUL_DOMAIN          — Kuulutin (see ../Kuulutin/DEPLOYMENT.md)
#
# The instance needs Docker + the Docker Compose plugin installed and the deploy user in the
# `docker` group. See DEPLOYMENT.md for the one-time server setup.
#
# NOTE: the `secrets` context can't be read directly in a job-level `if:` (GitHub Actions
# restriction), so the "ready" check below reads secrets into env vars in a step and gates
# every later step on that step's output instead — the documented workaround.

name: Deploy to OCI

on:
  push:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'Caddyfile'
      - '.github/workflows/deploy-oci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    env:
      OCI_HOST: ${{ secrets.OCI_HOST }}
      OCI_SSH_USER: ${{ secrets.OCI_SSH_USER }}
      OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
      OCI_DEPLOY_PATH: ${{ secrets.OCI_DEPLOY_PATH }}
      SUP_DOMAIN: ${{ secrets.SUP_DOMAIN }}
      SUB_DOMAIN: ${{ secrets.SUB_DOMAIN }}
      KUL_DOMAIN: ${{ secrets.KUL_DOMAIN }}
    steps:
      - name: Check required secrets are set
        id: check
        run: |
          if [ -z "$OCI_HOST" ] || [ -z "$OCI_SSH_USER" ] || [ -z "$OCI_SSH_KEY" ]; then
            echo "Required secrets are not all set yet — skipping deploy. See DEPLOYMENT.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Set up SSH
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$OCI_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy deployment files
        if: steps.check.outputs.ready == 'true'
        run: |
          DEPLOY_PATH="${OCI_DEPLOY_PATH:-/opt/taloni}"
          ssh -i ~/.ssh/deploy_key "$OCI_SSH_USER@$OCI_HOST" "mkdir -p $DEPLOY_PATH"
          scp -i ~/.ssh/deploy_key docker-compose.yml Caddyfile \
            "$OCI_SSH_USER@$OCI_HOST:$DEPLOY_PATH/"
          ssh -i ~/.ssh/deploy_key "$OCI_SSH_USER@$OCI_HOST" "cat > $DEPLOY_PATH/.env" <<EOF
          SUP_DOMAIN=$SUP_DOMAIN
          SUB_DOMAIN=$SUB_DOMAIN
          KUL_DOMAIN=$KUL_DOMAIN
          EOF

      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: |
          DEPLOY_PATH="${OCI_DEPLOY_PATH:-/opt/taloni}"
          ssh -i ~/.ssh/deploy_key "$OCI_SSH_USER@$OCI_HOST" "
            set -e
            docker network create frontdoor 2>/dev/null || true
            cd $DEPLOY_PATH
            docker compose pull caddy
            docker compose --profile proxy up -d
          "
