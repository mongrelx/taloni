# Builds the taloni API image, pushes it to GHCR, then deploys it to an OCI compute instance
# over SSH (docker compose pull && up). Inert until the required secrets exist — see below.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   OCI_HOST          — the compute instance's public IP or hostname
#   OCI_SSH_USER       — SSH username (e.g. "ubuntu" or "opc")
#   OCI_SSH_KEY        — SSH private key (PEM) matching a public key authorized on the instance
#   TALONI_API_KEY     — the API key the deployed server should require (Authorization: Bearer)
#
# Optional secrets:
#   OCI_DEPLOY_PATH    — remote directory to deploy into (default: /opt/taloni)
#   OCI_DOMAIN         — if set, deploys behind Caddy with automatic Let's Encrypt TLS on 443
#
# The instance needs Docker + the Docker Compose plugin installed and the deploy user in the
# `docker` group. See DEPLOYMENT.md for the one-time server setup.
#
# NOTE: the `secrets` context can't be read directly in a job-level `if:` (GitHub Actions
# restriction), so the "ready" check below reads secrets into env vars in a step and gates
# every later step on that step's output instead — the documented workaround.

name: Deploy to OCI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      OCI_HOST: ${{ secrets.OCI_HOST }}
      OCI_SSH_USER: ${{ secrets.OCI_SSH_USER }}
      OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
      TALONI_API_KEY: ${{ secrets.TALONI_API_KEY }}
      OCI_DEPLOY_PATH: ${{ secrets.OCI_DEPLOY_PATH }}
      OCI_DOMAIN: ${{ secrets.OCI_DOMAIN }}
    steps:
      - name: Check required secrets are set
        id: check
        run: |
          if [ -z "$OCI_HOST" ] || [ -z "$OCI_SSH_USER" ] || [ -z "$OCI_SSH_KEY" ] || [ -z "$TALONI_API_KEY" ]; then
            echo "Required secrets are not all set yet — skipping deploy. See DEPLOYMENT.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      # GitHub-hosted runners are amd64; OCI's free-tier Ampere shapes are arm64. Build both so
      # the image works on either, via QEMU emulation under buildx (no marketplace action needed
      # — tonistiigi/binfmt is the same image docker/setup-qemu-action itself wraps).
      - name: Set up QEMU + buildx for multi-arch build
        if: steps.check.outputs.ready == 'true'
        run: |
          docker run --rm --privileged tonistiigi/binfmt --install all
          docker buildx create --use

      - name: Build and push multi-arch image
        if: steps.check.outputs.ready == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t ghcr.io/${{ github.repository_owner }}/taloni:latest \
            -t ghcr.io/${{ github.repository_owner }}/taloni:${{ github.sha }} \
            --push \
            .

      - name: Set up SSH
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$OCI_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy deployment files
        if: steps.check.outputs.ready == 'true'
        run: |
          DEPLOY_PATH="${OCI_DEPLOY_PATH:-/opt/taloni}"
          ssh -i ~/.ssh/deploy_key "$OCI_SSH_USER@$OCI_HOST" "mkdir -p $DEPLOY_PATH"
          scp -i ~/.ssh/deploy_key docker-compose.yml Caddyfile \
            "$OCI_SSH_USER@$OCI_HOST:$DEPLOY_PATH/"
          ssh -i ~/.ssh/deploy_key "$OCI_SSH_USER@$OCI_HOST" "cat > $DEPLOY_PATH/.env" <<EOF
          TALONI_API_KEY=$TALONI_API_KEY
          DOMAIN=$OCI_DOMAIN
          EOF

      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: |
          DEPLOY_PATH="${OCI_DEPLOY_PATH:-/opt/taloni}"
          PROFILE_FLAG=""
          [ -n "$OCI_DOMAIN" ] && PROFILE_FLAG="--profile proxy"
          ssh -i ~/.ssh/deploy_key "$OCI_SSH_USER@$OCI_HOST" "
            set -e
            cd $DEPLOY_PATH
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            docker compose pull taloni
            docker compose $PROFILE_FLAG up -d
          "
