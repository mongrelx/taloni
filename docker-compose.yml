# Shared Caddy frontdoor for the mongrelx app family. See DEPLOYMENT.md.
#
# Each sibling app repo (StraightUpProgress, StraightUpBeats, Kuulutin, ...) runs its own
# container on the external `frontdoor` network and gets one site block in Caddyfile, keyed
# by its own `<PREFIX>_DOMAIN` env var below (e.g. sslip.io addresses like
# "straightupprogress.203-0-113-1.sslip.io" work fine — no owned domain needed).

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ['proxy']
    environment:
      # StraightUpProgress. See ../StraightUpProgress/DEPLOYMENT.md.
      SUP_DOMAIN: ${SUP_DOMAIN:-sup.localhost}
      # StraightUpBeats, same pattern. See ../StraightUpBeats/DEPLOYMENT.md.
      SUB_DOMAIN: ${SUB_DOMAIN:-sub.localhost}
      # Kuulutin, same pattern. See ../Kuulutin/DEPLOYMENT.md.
      KUL_DOMAIN: ${KUL_DOMAIN:-kul.localhost}
      # landing zone (shared OAuth/sync service), same pattern. See ../landingzone/DEPLOYMENT.md.
      LZ_DOMAIN: ${LZ_DOMAIN:-lz.localhost}
      # StraightUpHouses, same pattern. See ../StraightUpHouses/DEPLOYMENT.md.
      SUH_DOMAIN: ${SUH_DOMAIN:-suh.localhost}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - default
      - frontdoor

volumes:
  caddy-data:
  caddy-config:

networks:
  frontdoor:
    external: true
