# Shared base-infra for the StraightUp* projects on this OCI instance: a single Caddy
# reverse-proxy "frontdoor" providing automatic Let's Encrypt TLS (works with a free
# sslip.io hostname — see DEPLOYMENT.md) for every sibling app, each in its own repo
# joining the external `frontdoor` network below.
#
#   DOMAIN=... OCI_DOMAIN=... SUP_DOMAIN=... SUB_DOMAIN=... docker compose up -d
#
# This repo used to run the taloni app itself alongside Caddy; that app moved to its
# own repo (github.com/mongrelx/StraightUpHouses) and joins `frontdoor` like the others.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      # StraightUpHouses (formerly the app in this repo — see Caddyfile)
      # SUP_DOMAIN / SUB_DOMAIN: sibling projects sharing this same Caddy instance —
      # see their own DEPLOYMENT.md (StraightUpProgress / StraightUpBeats respectively).
      SUP_DOMAIN: ${SUP_DOMAIN:-sup.localhost}
      SUB_DOMAIN: ${SUB_DOMAIN:-sub.localhost}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - frontdoor

volumes:
  caddy-data:
  caddy-config:

networks:
  frontdoor:
    external: true
