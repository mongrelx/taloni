# Tuotantoajo taloni-REST-API:lle (issue #18/#32). Katso DEPLOYMENT.md.
#
# Caddyn kautta (automaattinen Let's Encrypt-TLS, kun DOMAIN on oikea verkkotunnus — myös
# sslip.io-osoite kelpaa, esim. "203-0-113-1.sslip.io" ilman omaa domainia):
#   DOMAIN=esimerkki.fi TALONI_API_KEY=... docker compose --profile proxy up -d
#
# Ilman TLS:ää / suoraan porttiin 3000 (kehitys/testaus — HUOM: API-avain kulkee salaamattomana):
#   ota "ports: - '3000:3000'" alta käyttöön ja aja: docker compose up -d taloni

services:
  taloni:
    build: .
    image: ghcr.io/mongrelx/taloni:latest
    restart: unless-stopped
    environment:
      TALONI_API_KEY: ${TALONI_API_KEY:?Aseta TALONI_API_KEY (esim. .env-tiedostossa)}
      TALONI_API_HOST: 0.0.0.0
      TALONI_API_PORT: 3000
    volumes:
      - taloni-data:/home/node/.taloni
    # - '3000:3000'  # avaa vain jos et käytä Caddy/TLS-profiilia (ks. yllä)

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ['proxy']
    depends_on:
      - taloni
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  taloni-data:
  caddy-data:
  caddy-config:
